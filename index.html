<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Flashcards – Data Warehousing Architecture Types</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="app">
    <h1>📘 Flashcards</h1>

    <!-- Deck selector -->
    <select id="deckSelector" onchange="loadDeck()">
  <option value="unit1">Unit 1</option>
  <option value="unit2">Unit 2</option>
  <option value="unit3">Unit 3</option>
  <option value="unit4">Unit 4</option>
  <option value="unit5">Unit 5</option>
  <option value="unit6">Unit 6</option>
  <option value="unit7">Unit 7</option>
</select>

    <!-- Tag selector -->
   <select id="tagSelector" onchange="filterByTag()">
  <option value="all">All Sections</option>
  <option value="1.1">Section 1.1</option>
  <option value="1.2">Section 1.2</option>
  <option value="1.3">Section 1.3</option>
  <option value="1.4">Section 1.4</option>
  <option value="1.5">Section 1.5</option>
    <!-- Unit 2 -->
  <option value="2.1">Section 2.1</option>
  <option value="2.2">Section 2.2</option>
    <!-- Unit 3 -->
  <option value="3.1">Section 3.1</option>
  <option value="3.2">Section 3.2</option>
  <option value="3.3">Section 3.3</option>
  <option value="3.4">Section 3.4</option>
  <option value="3.5">Section 3.5</option>
     <!-- Unit 4 -->
  <option value="4.1">Section 4.1</option>
  <option value="4.2">Section 4.2</option>
  <option value="4.3">Section 4.3</option>
     <!-- Unit 5 -->
  <option value="5.1">Section 5.1</option>
  <option value="5.2">Section 5.2</option>
  <option value="5.3">Section 5.3</option>
  <option value="5.4">Section 5.4</option>
  <option value="5.5">Section 5.5</option>
     <!-- Unit 6 -->
  <option value="6.1">Section 6.1</option>
  <option value="6.2">Section 6.2</option>
  <option value="6.3">Section 6.3</option>
        <!-- Unit 7 -->
  <option value="7.1">Section 7.1</option>
  <option value="7.2">Section 7.2</option>
  <option value="7.3">Section 7.3</option>
  <option value="7.4">Section 7.4</option>
  
  <option value="important">⭐ Important only</option>
</select>

    <div class="card">
      <div class="question" id="question"></div>
      <div class="answer hidden" id="answer"></div>
    </div>

   <div class="controls">
  <button onclick="showAnswer()">Show Answer</button>
  <button onclick="prevCard()">Previous</button>
  <button onclick="nextCard()">Next</button>
  <button onclick="toggleImportant()">⭐ Mark as Important</button>
</div>

    <p class="counter" id="counter"></p>
  </div>

  <script src="decks/unit1.js"></script>
  <script src="decks/unit2.js"></script>
  <script src="decks/unit3.js"></script>
  <script src="decks/unit4.js"></script>
  <script src="decks/unit5.js"></script>
  <script src="decks/unit6.js"></script>
  <script src="decks/unit7.js"></script>
  <script src="script.js"></script>
</body>
</html>
